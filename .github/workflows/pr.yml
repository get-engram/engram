name: PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same PR.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # About 6 minutes with the daemon tests below; room for a slow runner.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Start and stop the real daemon from the build (engram#602).
      - name: Daemon smoke test
        working-directory: apps/cli
        run: node scripts/smoke-daemon.mjs

      # Sign in, out and between accounts under the real daemon, against a
      # fake server: what reaches it, with which key (engram#594, #595, #625).
      - name: Daemon account-switch test
        working-directory: apps/cli
        run: node scripts/e2e-account-switch.mjs

      # A conversation Engram no longer has, under the real daemon, against a
      # fake server that answers as the real one does: its messages are kept
      # and not sent, it isn't created again, and it is checked again later
      # (engram#593).
      - name: Daemon conversation-gone test
        working-directory: apps/cli
        run: node scripts/e2e-conversation-gone.mjs

      # An opt-out the API key can't delete, under the real daemon, against a
      # fake server that refuses as the real one does: the delete is kept, not
      # tried again with that key, said once in status, and made once a key
      # that can is saved (engram#597).
      - name: Daemon delete-scope test
        working-directory: apps/cli
        run: node scripts/e2e-delete-scope.mjs

      # Two starts at once, a launchd-style start beside a running daemon, a
      # daemon killed outright, its socket removed, and one from before the
      # lock: one daemon runs, and each message reaches the server once
      # (engram#612).
      - name: Daemon single-instance test
        working-directory: apps/cli
        run: node scripts/e2e-daemon-lock.mjs

      # `pnpm build` runs `wrangler deploy --dry-run`, which only bundles the
      # worker; nothing evaluates the result. Boot it in workerd so an error
      # thrown while the module graph loads blocks the merge instead of failing
      # the production upload (#528).
      - name: Boot worker bundle in workerd
        working-directory: apps/mcp-server
        run: pnpm smoke:bundle

  # The daemon has Windows-only code paths (the worker's path, start at login
  # through the Run key, reg.exe) that nothing else here runs (engram#602).
  cli-windows:
    name: CLI on Windows (daemon start, start at login)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      # Windows runners check text files out with CRLF line endings, which
      # the tests' expected output doesn't have.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # better-sqlite3 downloads a prebuilt binary from GitHub releases. When
      # that download fails it builds from source instead, and that can't
      # work on this image (pnpm 9's node-gyp doesn't know Visual Studio
      # 2026). So a few minutes of GitHub download errors failed the job
      # (engram#632). Another install re-runs the build script that failed.
      - name: Install dependencies
        shell: bash
        run: |
          for pause in 30 90 180; do
            pnpm install --frozen-lockfile && exit 0
            echo "::warning::pnpm install failed; trying again in ${pause}s"
            sleep "$pause"
          done
          pnpm install --frozen-lockfile

      - name: Build the CLI
        run: pnpm --filter '@getengram/cli...' build

      - name: Test the CLI
        working-directory: apps/cli
        run: pnpm test

      - name: Daemon smoke test
        working-directory: apps/cli
        run: node scripts/smoke-daemon.mjs
