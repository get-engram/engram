name: PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same PR.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # About 7 minutes with the daemon tests below; room for a slow runner.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Start and stop the real daemon from the build (engram#602).
      - name: Daemon smoke test
        working-directory: apps/cli
        run: node scripts/smoke-daemon.mjs

      # Sign in, out and between accounts under the real daemon, against a
      # fake server: what reaches it, with which key (engram#594, #595, #625).
      - name: Daemon account-switch test
        working-directory: apps/cli
        run: node scripts/e2e-account-switch.mjs

      # A conversation Engram no longer has, under the real daemon, against a
      # fake server that answers as the real one does: its messages are kept
      # and not sent, it isn't created again, and it is checked again later
      # (engram#593).
      - name: Daemon conversation-gone test
        working-directory: apps/cli
        run: node scripts/e2e-conversation-gone.mjs

      # An opt-out the API key can't delete, under the real daemon, against a
      # fake server that refuses as the real one does: the delete is kept, not
      # tried again with that key, said once in status, and made once a key
      # that can is saved (engram#597).
      - name: Daemon delete-scope test
        working-directory: apps/cli
        run: node scripts/e2e-delete-scope.mjs

      # A vault key that can't be read, under the real daemon, against a fake
      # server: commands that would send content refuse, the daemon holds its
      # sends and says why, and once the key reads again they are sent with
      # the vault's secrets scrubbed out; nothing is lost (engram#677).
      - name: Daemon vault-key test
        working-directory: apps/cli
        run: node scripts/e2e-vault-key.mjs

      # Two starts at once, a launchd-style start beside a running daemon, a
      # daemon killed outright, its socket removed, and one from before the
      # lock: one daemon runs, and each message reaches the server once
      # (engram#612).
      - name: Daemon single-instance test
        working-directory: apps/cli
        run: node scripts/e2e-daemon-lock.mjs

      # A daemon left running as root by `sudo engram start` from before
      # engram#653, really running as root (engram#680): status, start, stop,
      # install and the banner say so and how to stop it, no daemon of the
      # user's starts beside it, the worker won't run as root, and the
      # commands they're given work.
      - name: Daemon left running as root test
        working-directory: apps/cli
        run: ENGRAM_E2E_ROOT=1 node scripts/e2e-root-daemon.mjs

      # Start at login under the real systemd (engram#615): the unit `engram
      # install` writes, started when the user's service manager starts, as
      # at login, started again after a crash and not after `engram stop`.
      # Lingering gives the runner's user a service manager of its own.
      - name: Daemon systemd test
        working-directory: apps/cli
        run: |
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 1 30); do
            [ -S "$XDG_RUNTIME_DIR/systemd/private" ] && break
            sleep 1
          done
          ENGRAM_E2E_SYSTEMD=1 node scripts/e2e-systemd.mjs

      # `pnpm build` runs `wrangler deploy --dry-run`, which only bundles the
      # worker; nothing evaluates the result. Boot it in workerd so an error
      # thrown while the module graph loads blocks the merge instead of failing
      # the production upload (#528).
      - name: Boot worker bundle in workerd
        working-directory: apps/mcp-server
        run: pnpm smoke:bundle

  # The daemon has Windows-only code paths (the worker's path, start at login
  # through the Run key, reg.exe) that nothing else here runs (engram#602).
  cli-windows:
    name: CLI on Windows (daemon start, start at login)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      # Windows runners check text files out with CRLF line endings, which
      # the tests' expected output doesn't have.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # better-sqlite3 downloads a prebuilt binary from GitHub releases. When
      # that download fails it builds from source instead, and that can't
      # work on this image (pnpm 9's node-gyp doesn't know Visual Studio
      # 2026). So a few minutes of GitHub download errors failed the job
      # (engram#632). Another install re-runs the build script that failed.
      - name: Install dependencies
        shell: bash
        run: |
          for pause in 30 90 180; do
            pnpm install --frozen-lockfile && exit 0
            echo "::warning::pnpm install failed; trying again in ${pause}s"
            sleep "$pause"
          done
          pnpm install --frozen-lockfile

      - name: Build the CLI
        run: pnpm --filter '@getengram/cli...' build

      - name: Test the CLI
        working-directory: apps/cli
        run: pnpm test

      - name: Daemon smoke test
        working-directory: apps/cli
        run: node scripts/smoke-daemon.mjs

  # The daemon's macOS code paths under the real launchd (engram#655): the
  # unit tests check each launchctl call against a stub, so nothing else here
  # shows launchd loading the plist `engram install` writes, and running it.
  # The macOS temp folder is too long a place for the daemon's socket (about
  # 100 bytes at most), so the daemon tests run under the runner's own.
  cli-macos:
    name: CLI on macOS (daemon start, start at login)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the CLI
        run: pnpm --filter '@getengram/cli...' build

      - name: Test the CLI
        working-directory: apps/cli
        run: pnpm test

      - name: Daemon smoke test
        working-directory: apps/cli
        env:
          TMPDIR: ${{ runner.temp }}
        run: node scripts/smoke-daemon.mjs

      # The vault-key test above, here too: its desktop notification goes
      # through osascript (engram#677).
      - name: Daemon vault-key test
        working-directory: apps/cli
        env:
          TMPDIR: ${{ runner.temp }}
        run: node scripts/e2e-vault-key.mjs

      # Start at login under the user's own launchd: install, as at login, a
      # crash and `engram stop`, an older CLI's plist and a broken one, a job
      # switched off with launchctl, and uninstall.
      - name: Daemon launchd test
        working-directory: apps/cli
        env:
          TMPDIR: ${{ runner.temp }}
          ENGRAM_E2E_LAUNCHD: "1"
        run: node scripts/e2e-launchd.mjs

      # The root daemon test above, here with the job `sudo engram install`
      # loaded into launchd's system domain before engram#653, running a
      # daemon from then and this build's worker (engram#680).
      - name: Daemon left running as root test
        working-directory: apps/cli
        env:
          TMPDIR: ${{ runner.temp }}
          ENGRAM_E2E_ROOT: "1"
        run: node scripts/e2e-root-daemon.mjs
