name = "engram-mcp-server"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "https://getengram.app"

# Secrets (set via `wrangler secret put`):
#   SUPABASE_JWT_SECRET     — Supabase project JWT secret (HS256, from dashboard → Settings → API)
#   STRIPE_SECRET_KEY       — Stripe API key
#   STRIPE_WEBHOOK_SECRET   — Stripe webhook signing secret
#   STRIPE_PRICE_ID_PRO     — Stripe price ID for Pro plan
#   STRIPE_PRICE_ID_TEAM    — Stripe price ID for Team plan
#   ADMIN_SECRET            — the owner's admin bearer (/admin routes, admin API calls), nothing else (src/services/secrets.ts)
#   INTERNAL_CRON_SECRET    — bearer for engram-web's email and report routes (same value in engram-web)
#   UNSUBSCRIBE_HMAC_KEY    — signs the unsubscribe links in lifecycle emails
#   UNSUBSCRIBE_HMAC_KEY_PREVIOUS — the signing key before the last change, removed 60 days after it

[[d1_databases]]
binding = "DB"
database_name = "engram-db"
database_id = "fcf57f81-8d26-4288-aee5-11c42d6ca0d5"
migrations_dir = "../../packages/db/migrations"

# Verbatim message content lives here (unbounded), keyed by message id. D1
# holds only metadata + a pointer, so it never hits the 10 GB cap again.
[[r2_buckets]]
binding = "CONTENT"
bucket_name = "engram-content"

# Chunk text (engram#384), keyed `<conversation_id>/<chunk_id>`. A second,
# independent copy of every chunk's text while D1 still holds the first;
# D1's column is only cleared, row by row, once its copy here is verified.
[[r2_buckets]]
binding = "CHUNKS"
bucket_name = "engram-chunks"

[[vectorize]]
binding = "VECTORIZE"
index_name = "engram-vectors"

# Self service-binding — lets the drain cron fan out to parallel sub-invocations
# of this same worker (each with its own subrequest/connection budget) without
# going over the public internet.
[[services]]
binding = "SELF"
service = "engram-mcp-server"

# Drain fleet — Durable Objects whose alarm invocations drain legacy content
# D1 -> R2 in true parallel, entirely serverless.
[[durable_objects.bindings]]
name = "DRAINER"
class_name = "DrainerDO"

[[migrations]]
tag = "v1-drainer"
new_sqlite_classes = ["DrainerDO"]

# Chunk mover (engram#384) — one named instance that copies and verifies
# chunk text into CHUNKS a page at a time, paced for single-statement D1.
[[durable_objects.bindings]]
name = "CHUNK_MOVER"
class_name = "ChunkMoverDO"

[[migrations]]
tag = "v2-chunk-mover"
new_sqlite_classes = ["ChunkMoverDO"]

[ai]
binding = "AI"

# Custom domain — serves MCP at mcp.getengram.app
[[routes]]
pattern = "mcp.getengram.app/*"
zone_name = "getengram.app"

# Crons — every-minute content drain (D1 -> R2, no-op once drained);
# 03:00 GDPR purge of soft-deleted orgs; 13:00 daily ops report (built
# here, emailed by engram-web /api/reports/daily).
[triggers]
crons = ["*/10 * * * *", "0 3 * * *", "0 13 * * *"]
