# Nightly off-Cloudflare backup of the production D1 database.
#
# D1's built-in Time Travel gives 30-day point-in-time restore, but it
# lives inside the same Cloudflare account — this export is the copy that
# survives an account-level problem. Runs at 04:00 UTC (after the 03:00
# purge cron) and keeps 14 days of compressed dumps as workflow artifacts.
name: Nightly D1 backup
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Export D1 to SQL dump (per table — fts5 blocks whole-db export)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # chunks_fts* (the FTS5 virtual table + its shadow tables) is
          # excluded: D1 refuses to export virtual tables, and it's fully
          # derived — restore = apply these dumps, then re-run migration
          # 0006_add_fts5_search.sql to rebuild the search index.
          TABLES=$(npx wrangler d1 execute engram-db --remote --json --command             "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE 'chunks_fts%' AND name NOT LIKE 'd1_%' AND name NOT LIKE '_cf_%'"             | jq -r '.[0].results[].name')
          echo "exporting: $TABLES"
          for t in $TABLES; do
            npx wrangler d1 export engram-db --remote --table="$t" --output="dump_$t.sql"
          done
          cat dump_*.sql > backup.sql
          gzip -9 backup.sql
          ls -lh backup.sql.gz
      - uses: actions/upload-artifact@v4
        with:
          name: engram-db-${{ github.run_id }}
          path: apps/mcp-server/backup.sql.gz
          retention-days: 14
          if-no-files-found: error
